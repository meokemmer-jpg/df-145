  reason: "SLA-Compliance-Audit-Automation, manuelle Checks ~6h/Quartal eingespart"
  schwer_quantifizierbar: false

migration_provenance:
  source_welle: 25
  pre_skeleton_engine_loc: 200
  reference_pattern: df-108
  skeleton_created: 2026-05-13

trinity_compliance:
